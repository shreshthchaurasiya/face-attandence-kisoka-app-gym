<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(34, 197, 94, 0)" />
      <stop offset="50%" stop-color="rgba(34, 197, 94, 0.85)" />
      <stop offset="100%" stop-color="rgba(34, 197, 94, 0)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer Biometric Scan Frame Corners -->
  <g stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" fill="none">
    <!-- Top-Left -->
    <path d="M 80 160 L 80 110 A 30 30 0 0 1 110 80 L 160 80" />
    <!-- Top-Right -->
    <path d="M 352 80 L 402 80 A 30 30 0 0 1 432 110 L 432 160" />
    <!-- Bottom-Left -->
    <path d="M 80 352 L 80 402 A 30 30 0 0 0 110 432 L 160 432" />
    <!-- Bottom-Right -->
    <path d="M 352 432 L 402 432 A 30 30 0 0 0 432 402 L 432 352" />
  </g>

  <!-- Horizontal Scanning Laser Beam -->
  <line x1="80" y1="256" x2="432" y2="256" stroke="url(#beamGrad)" stroke-width="8" />

  <!-- Stylized Face Contour -->
  <!-- Head Silhouette -->
  <path d="M 170 210 C 170 140, 342 140, 342 210 C 342 280, 290 350, 256 370 C 222 350, 170 280, 170 210 Z" 
        fill="none" stroke="#64748b" stroke-width="6" stroke-dasharray="8 8" opacity="0.6" />

  <!-- Eyes Biometric Crosshairs -->
  <!-- Left Eye -->
  <circle cx="215" cy="210" r="14" fill="none" stroke="#38bdf8" stroke-width="4" />
  <circle cx="215" cy="210" r="4" fill="#38bdf8" />
  <!-- Right Eye -->
  <circle cx="297" cy="210" r="14" fill="none" stroke="#38bdf8" stroke-width="4" />
  <circle cx="297" cy="210" r="4" fill="#38bdf8" />

  <!-- Nose Bridge Node -->
  <circle cx="256" cy="256" r="6" fill="#22c55e" />
  <!-- Mouth Landmark Line -->
  <path d="M 230 305 Q 256 318 282 305" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round" />

  <!-- Biometric Nodes & Connecting Constellation -->
  <g stroke="#06b6d4" stroke-width="2" opacity="0.7">
    <line x1="215" y1="210" x2="256" y2="256" />
    <line x1="297" y1="210" x2="256" y2="256" />
    <line x1="256" y1="256" x2="256" y2="305" />
    <line x1="215" y1="210" x2="230" y2="305" />
    <line x1="297" y1="210" x2="282" y2="305" />
  </g>

  <!-- Small AI Verification Pill at Bottom -->
  <g transform="translate(196, 405)">
    <rect width="120" height="32" rx="16" fill="rgba(34, 197, 94, 0.2)" stroke="#22c55e" stroke-width="2" />
    <circle cx="22" cy="16" r="5" fill="#22c55e" />
    <text x="36" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#86efac" letter-spacing="1">AI FACE</text>
  </g>
</svg>
